<p>Buttons are written as <kbd>CABINET</kbd> console button. They're the defaults; change them for one game or a whole system with Home &gt; Controls (see <a href="controls-settings.html">Controls &amp; settings</a>). Settings &gt; BIOS check shows which BIOS files you have and where missing ones go.</p>
